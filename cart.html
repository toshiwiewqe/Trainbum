<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Your Cart — Trailbound</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="cart.css" />
  <link rel="icon" href="/icons/favicon.png" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <meta name="theme-color" content="#1a0401" />
</head>
<body>

  <div id="site-header-root"></div>
  <script src="header.js"></script>
  <script type="module" src="bootstrap-init.js"></script>

  <main class="cart-page">
    <div class="cart-page-header">
      <span class="cart-eyebrow">Step 1 of 2</span>
      <h3>Your cart</h3>
      <p>Review your gear and any trail bookings before checking out.</p>
    </div>

    <div class="cart-layout">
      <div>
        <div class="cart-list-header" id="cart-list-header">
          <div class="cart-list-header-left">
            <input type="checkbox" class="cart-checkbox" id="cart-select-all" aria-label="Select all items">
            <p class="cart-list-title">Select all <span class="cart-list-count" id="cart-list-count">00</span></p>
          </div>
          <button type="button" class="cart-remove-all" id="cart-remove-all">Remove all</button>
        </div>
        <div class="cart-list" id="cart-list"></div>
      </div>

      <div class="cart-summary">
        <h5>Summary</h5>
        <div class="summary-row">
          <span>Selected items</span>
          <span id="summary-count">0 items</span>
        </div>
        <div class="summary-row">
          <span>Subtotal</span>
          <span id="summary-subtotal">₱0</span>
        </div>
        <div class="summary-row">
          <span>Est. delivery</span>
          <span id="summary-delivery">₱0</span>
        </div>
        <div class="summary-row summary-row--tax">
          <span>Taxes</span>
          <span id="summary-tax">+₱0</span>
        </div>
        <div class="summary-row summary-row--discount">
          <span>Discount</span>
          <span id="summary-discount">−₱0</span>
        </div>
        <hr class="summary-divider">
        <div class="summary-row summary-row--total">
          <span>Final payment</span>
          <span id="summary-total">₱0</span>
        </div>

        <button type="button" class="cart-checkout-btn" id="cart-checkout-btn">Checkout</button>
        <a href="products.html" class="cart-continue-link">Continue shopping</a>
      </div>
    </div>

    <div class="cart-empty" id="cart-empty" hidden>
      <p>Your cart is empty.</p>
      <div class="cart-empty-actions">
        <a href="products.html" class="cart-empty-btn">Browse gear</a>
        <a href="booking.html" class="cart-empty-btn cart-empty-btn--ghost">Book a trail</a>
      </div>
    </div>
  </main>

  <script type="module" src="cart.js"></script>
</body>
</html>
