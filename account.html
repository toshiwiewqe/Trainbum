<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trailbound — My Account</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="account.css" />
  </head>
  <body>
    <div id="site-header-root"></div>
    <script src="header.js"></script>
    <script type="module" src="bootstrap-init.js"></script>

    <main class="account-page">
      <div class="account-card">
        <div class="account-avatar-wrap">
          <img id="account-avatar" class="account-avatar" src="" alt="Profile photo" hidden>
          <div id="account-avatar-fallback" class="account-avatar-fallback"></div>
        </div>

        <h3 id="account-name">Loading...</h3>
        <p id="account-email" class="account-email"></p>
        <p id="account-member-since" class="account-member-since"></p>

        <div class="account-section">
          <label for="display-name-input">Display name</label>
          <div class="account-edit-row">
            <input type="text" id="display-name-input" class="account-input" placeholder="Your name">
            <button id="save-name-btn" class="account-save-btn">Save</button>
          </div>
          <p id="account-feedback" class="account-feedback" hidden></p>
        </div>

        <div class="account-actions">
          <a href="booking.html" class="account-link-btn">My Bookings</a>
          <button id="logout-btn" class="account-logout-btn">Log Out</button>
        </div>
      </div>
    </main>

    <script type="module" src="auth-nav.js"></script>
    <script type="module" src="account.js"></script>
  </body>
</html>
