<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trailbound</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="icon" href="/icons/favicon.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="theme-color" content="#1a0401" />

    <!-- first frame on the wire before any script parses -->
    <link rel="preload" as="image" href="/frames/ezgif-frame-001.jpg" />
  </head>
  <body>
    <div id="site-header-root"></div>
    <script src="header.js"></script>
    <script type="module" src="bootstrap-init.js"></script>

    <!--
      The homepage. ScrollTrigger (in script.js) pins this for
      window.innerHeight * 5 and scrubs a 300-frame JPG sequence
      across that distance, fading the three copy panels in and out.
      Frames live in public/frames/ and are served from /frames/.
    -->
    <section class="framescene" id="framescene">
      <canvas id="frame-canvas" class="framescene-canvas"></canvas>

      <!-- darkens the footage so the copy reads as light type on it -->
      <div class="framescene-tint"></div>

      <div class="framescene-overlay">
        <div class="framescene-panel framescene-panel--one" data-panel="1">
          <div>
            <h1 class="fs-rise" style="transition-delay: 0ms">Trailbound</h1>
            <p class="fs-rise" style="transition-delay: 150ms">
              Luzon's peaks, one trail at a time
            </p>
          </div>
        </div>

        <div class="framescene-panel framescene-panel--two" data-panel="2">
          <h3 class="fs-rise" style="transition-delay: 0ms">
            From Pulag's sea of clouds
            <span class="fs-dim-70">to Batulao's open ridges</span>
            <span class="fs-dim-45">and every summit between</span>
          </h3>
        </div>

        <div class="framescene-panel framescene-panel--three" data-panel="3">
          <div class="fs-inner">
            <h3 class="fs-rise" style="transition-delay: 150ms">
              Plan it. Book it.<br />Climb it.
            </h3>
            <a href="#trails" class="framescene-cta fs-rise" style="transition-delay: 300ms">
              <span>Find your trail</span>
              <span class="framescene-cta-dot" aria-hidden="true">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M5 12h14"></path><path d="m12 5 7 7-7 7"></path>
                </svg>
              </span>
            </a>
          </div>
        </div>
      </div>

      <div class="framescene-veil" id="frame-veil" aria-hidden="true">
        <div class="framescene-veil-bar">
          <span class="framescene-veil-fill" id="frame-veil-fill"></span>
        </div>
      </div>
    </section>

    <!-- Trail search / filter grid, populated by trails.js -->
    <section class="trails-section" id="trails">
      <div class="trails-header">
        <h3>Find Your Trail</h3>
        <p>Search hiking trails by difficulty, location, and price</p>
      </div>

      <div class="trails-filters">
        <input type="text" id="trail-search" placeholder="SEARCH TRAILS OR LOCATION..." />

        <select id="trail-difficulty-filter">
          <option value="">All Difficulties</option>
          <option value="Easy">Easy</option>
          <option value="Moderate">Moderate</option>
          <option value="Hard">Hard</option>
        </select>

        <select id="trail-sort">
          <option value="name">Sort: Name (A-Z)</option>
          <option value="price-asc">Sort: Price (Low to High)</option>
          <option value="price-desc">Sort: Price (High to Low)</option>
        </select>
      </div>

      <div class="trails-grid" id="trails-grid">
        <p class="trails-status">Loading trails...</p>
      </div>
    </section>

    <script type="module" src="trails.js"></script>
    <script type="module" src="script.js"></script>
    <script type="module" src="auth-nav.js"></script>
  </body>
</html>
