<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trailbound — Book Your Hike</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="booking.css" />
    <link rel="stylesheet" href="post-booking-modal.css" />
    <link rel="icon" href="/icons/favicon.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="theme-color" content="#1a0401" />
  </head>
  <header class="site-header">
      <div class="site-header-logo">
      <img src="finaltrailboundlogo.png" alt="Site Logo"> </div>
      <nav class="site-header-nav">
        <nav class="site-header-nav">
        <a href="index.html">Home</a>
        <a href="index.html#trails">Trails</a>
        <a href="products.html">Products</a>
        <a href="booking.html" class="active">Book Now</a>
        <a href="#">Contact</a>
        <a href="login.html">Log In</a>
      <span class="cart-badge">
        <a href="cart.html" class="account-icon-link" aria-label="Cart">
          🛒
          <span id="cart-count" class="cart-count" hidden>0</span>
        </a>
      </span>
    </nav>
  </header>

    <main class="booking-page">
      <div class="booking-page-header">
        <span class="booking-eyebrow">Plan your trip</span>
        <h3>Book your hike</h3>
        <p>Pick a trail, a date, and a certified guide to get started</p>
      </div>

      <div class="booking-layout">
        <!-- Booking form -->
        <form id="booking-form" class="booking-form">

          <div class="form-step">
            <div class="form-step-label">
              <span class="form-step-number">01</span>
              <span>Trail &amp; package</span>
            </div>

            <div class="form-group">
              <label for="trail-select">Trail</label>
              <select id="trail-select" required>
                <option value="" disabled selected>Select a trail...</option>
              </select>
            </div>

            <div id="trail-info" class="trail-info" hidden>
              <img id="trail-info-img" src="" alt="" />
              <div class="trail-info-details">
                <p id="trail-info-meta"></p>
                <p id="trail-info-desc"></p>
              </div>
            </div>

            <div class="form-group">
              <label for="package-select">Package</label>
              <select id="package-select" required disabled>
                <option value="" disabled selected>Select a trail first...</option>
              </select>
            </div>

            <div id="package-info" class="trail-info" hidden>
              <div class="trail-info-details">
                <p id="package-info-price"></p>
                <p id="package-info-includes"></p>
              </div>
            </div>

            <div class="form-group" id="activity-group" hidden>
              <label for="activity-select">Choose your activity</label>
              <select id="activity-select">
                <option value="" disabled selected>Select an activity...</option>
                <option value="Waterfall Stop">Waterfall Stop</option>
                <option value="Tree Planting">Tree Planting</option>
              </select>
            </div>
          </div>

          <div class="trail-divider" aria-hidden="true"></div>

          <div class="form-step">
            <div class="form-step-label">
              <span class="form-step-number">02</span>
              <span>Guide &amp; schedule</span>
            </div>

            <div class="form-group">
              <label for="guide-select">Certified guide</label>
              <select id="guide-select" required disabled>
                <option value="" disabled selected>Select a trail first...</option>
              </select>
            </div>

            <div class="form-row">
              <div class="form-group">
                <label for="booking-date">Hike date</label>
                <input type="date" id="booking-date" required />
              </div>
              <div class="form-group">
                <label for="group-size">Group size</label>
                <input type="number" id="group-size" min="1" max="15" value="1" required />
              </div>
            </div>
          </div>

          <div class="trail-divider" aria-hidden="true"></div>

          <div class="form-step">
            <div class="form-step-label">
              <span class="form-step-number">03</span>
              <span>Your details</span>
            </div>

            <div class="form-group">
              <label for="full-name">Full name</label>
              <input type="text" id="full-name" placeholder="Juan Dela Cruz" required />
            </div>

            <div class="form-row">
              <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="you@email.com" required />
              </div>
              <div class="form-group">
                <label for="contact-number">Contact number</label>
                <input type="tel" id="contact-number" placeholder="09XX XXX XXXX" required />
              </div>
            </div>

            <div class="form-row">
              <div class="form-group">
                <label for="emergency-name">Emergency contact name</label>
                <input type="text" id="emergency-name" placeholder="Maria Dela Cruz" required />
              </div>
              <div class="form-group">
                <label for="emergency-number">Emergency contact number</label>
                <input type="tel" id="emergency-number" placeholder="09XX XXX XXXX" required />
              </div>
            </div>
          </div>

          <div class="price-summary">
            <span>Total</span>
            <span id="price-total">₱0</span>
          </div>

          <button type="submit" class="booking-submit-btn">Confirm booking</button>

          <p id="booking-feedback" class="booking-feedback" hidden></p>
        </form>

        <!-- Booking history -->
        <div class="booking-history">
          <h4>My bookings</h4>
          <div id="bookings-list" class="bookings-list">
            <p class="bookings-empty">You have no bookings yet.</p>
          </div>
        </div>
      </div>
    </main>

    <!-- Post-booking choice modal: add gear, or head to checkout -->
    <div class="post-booking-modal-backdrop" id="post-booking-modal-backdrop" hidden></div>
    <div class="post-booking-modal" id="post-booking-modal" hidden role="dialog" aria-modal="true" aria-labelledby="post-booking-modal-title">
      <h4 id="post-booking-modal-title">Your hike is reserved!</h4>
      <p id="post-booking-modal-copy"></p>
      <div class="post-booking-modal-actions">
        <button type="button" class="post-booking-btn post-booking-btn--secondary" id="post-booking-add-gear">Add trail gear</button>
        <button type="button" class="post-booking-btn post-booking-btn--primary" id="post-booking-checkout">Proceed to checkout</button>
      </div>
    </div>

    <script type="module" src="booking.js"></script>
    <script type="module" src="auth-nav.js"></script>
  </body>
</html>
